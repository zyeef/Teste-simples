name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Criar projeto
        run: |
          mkdir -p src/main/java/com/example/xray/mixin src/main/resources/META-INF src/main/resources/assets/xrayhelper/lang

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.neoforged.net/releases' }
              }
          }
          rootProject.name = 'xrayhelper'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'java'
              id 'net.neoforged.moddev' version '2.0.78'
          }
          version = '1.0.0'
          group = 'com.example.xray'
          base { archivesName = 'xrayhelper' }
          java.toolchain.languageVersion = JavaLanguageVersion.of(21)
          neoForge {
              version = '21.1.172'
              runs { client { client() } }
              mods { xrayhelper { sourceSet sourceSets.main } }
          }
          repositories { mavenCentral() }
          EOF

          cat > src/main/resources/META-INF/neoforge.mods.toml <<'EOF'
          modLoader = "javafml"
          loaderVersion = "[4,)"
          license = "MIT"

          [[mods]]
          modId = "xrayhelper"
          version = "1.0.0"
          displayName = "Xray Helper"
          description = "Xray simples. Tecla X liga/desliga."

          [[mixins]]
          config = "xrayhelper.mixins.json"

          [[dependencies.xrayhelper]]
          modId = "neoforge"
          type = "required"
          versionRange = "[21.1,)"
          ordering = "NONE"
          side = "CLIENT"

          [[dependencies.xrayhelper]]
          modId = "minecraft"
          type = "required"
          versionRange = "[1.21.1,1.22)"
          ordering = "NONE"
          side = "CLIENT"
          EOF

          cat > src/main/resources/xrayhelper.mixins.json <<'EOF'
          {
            "required": true,
            "package": "com.example.xray.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": ["BlockMixin"],
            "injectors": { "defaultRequire": 1 }
          }
          EOF

          cat > src/main/resources/assets/xrayhelper/lang/en_us.json <<'EOF'
          {
            "key.xrayhelper.toggle": "Toggle Xray",
            "key.categories.xrayhelper": "Xray Helper"
          }
          EOF

          cat > src/main/java/com/example/xray/XrayState.java <<'EOF'
          package com.example.xray;

          import net.minecraft.tags.BlockTags;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.state.BlockState;
          import net.neoforged.neoforge.common.Tags;

          public final class XrayState {
              public static boolean enabled = false;
              private XrayState() {}

              public static boolean isHighlighted(BlockState s) {
                  return s.is(Tags.Blocks.ORES)
                          || s.is(Blocks.ANCIENT_DEBRIS)
                          || s.is(Blocks.SPAWNER)
                          || s.is(Blocks.CHEST)
                          || s.is(Blocks.LAVA)
                          || s.is(Blocks.WATER);
              }

              public static boolean isHidden(BlockState s) {
                  return s.is(BlockTags.BASE_STONE_OVERWORLD)
                          || s.is(BlockTags.BASE_STONE_NETHER)
                          || s.is(BlockTags.DIRT)
                          || s.is(BlockTags.SAND)
                          || s.is(Blocks.GRAVEL)
                          || s.is(Blocks.TUFF)
                          || s.is(Blocks.DRIPSTONE_BLOCK)
                          || s.is(Blocks.CALCITE)
                          || s.is(Blocks.BASALT)
                          || s.is(Blocks.BLACKSTONE)
                          || s.is(Blocks.END_STONE);
              }
          }
          EOF

          cat > src/main/java/com/example/xray/mixin/BlockMixin.java <<'EOF'
          package com.example.xray.mixin;

          import com.example.xray.XrayState;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.world.level.BlockGetter;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.state.BlockState;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(Block.class)
          public abstract class BlockMixin {
              @Inject(method = "shouldRenderFace", at = @At("HEAD"), cancellable = true)
              private static void xray$shouldRenderFace(BlockState state, BlockGetter level, BlockPos pos,
                                                        Direction face, BlockPos relativePos,
                                                        CallbackInfoReturnable<Boolean> cir) {
                  if (!XrayState.enabled) return;
                  if (XrayState.isHighlighted(state)) {
                      cir.setReturnValue(true);
                  } else if (XrayState.isHidden(state)) {
                      cir.setReturnValue(false);
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/xray/XrayMod.java <<'EOF'
          package com.example.xray;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.Minecraft;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.effect.MobEffects;
          import net.neoforged.api.distmarker.Dist;
          import net.neoforged.bus.api.IEventBus;
          import net.neoforged.bus.api.SubscribeEvent;
          import net.neoforged.fml.common.EventBusSubscriber;
          import net.neoforged.fml.common.Mod;
          import net.neoforged.neoforge.client.event.ClientTickEvent;
          import net.neoforged.neoforge.client.event.RegisterKeyMappingsEvent;
          import net.neoforged.neoforge.client.settings.KeyConflictContext;
          import org.lwjgl.glfw.GLFW;

          @Mod(value = XrayMod.MODID, dist = Dist.CLIENT)
          public class XrayMod {
              public static final String MODID = "xrayhelper";

              public static final KeyMapping TOGGLE = new KeyMapping(
                      "key.xrayhelper.toggle",
                      KeyConflictContext.IN_GAME,
                      InputConstants.Type.KEYSYM,
                      GLFW.GLFW_KEY_X,
                      "key.categories.xrayhelper");

              public XrayMod(IEventBus modBus) {
                  modBus.addListener(XrayMod::registerKeys);
              }

              private static void registerKeys(RegisterKeyMappingsEvent event) {
                  event.register(TOGGLE);
              }

              @EventBusSubscriber(modid = MODID, value = Dist.CLIENT)
              public static class Events {
                  @SubscribeEvent
                  public static void onTick(ClientTickEvent.Post event) {
                      Minecraft mc = Minecraft.getInstance();
                      if (mc.player == null || mc.level == null) return;

                      while (TOGGLE.consumeClick()) {
                          XrayState.enabled = !XrayState.enabled;
                          mc.levelRenderer.allChanged();
                          mc.player.displayClientMessage(
                                  Component.literal("Xray: " + (XrayState.enabled ? "ON" : "OFF")), true);
                          if (!XrayState.enabled) mc.player.removeEffect(MobEffects.NIGHT_VISION);
                      }

                      if (XrayState.enabled && !mc.player.hasEffect(MobEffects.NIGHT_VISION)) {
                          mc.player.addEffect(new MobEffectInstance(MobEffects.NIGHT_VISION, -1, 0, false, false, false));
                      }
                  }
              }
          }
          EOF

      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: xrayhelper
          path: build/libs/*.jar
